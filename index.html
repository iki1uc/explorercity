:root {
  --bg: #02030a;
  --bg-2: #060913;
  --surface: rgba(10, 14, 28, 0.72);
  --surface-strong: rgba(13, 18, 36, 0.92);
  --ink: #f4ead2;
  --muted: #a8b3c7;
  --faint: #66738d;
  --gold: #f6b73c;
  --gold-soft: #ffd98a;
  --cyan: #62e6ff;
  --cyan-deep: #1499bb;
  --violet: #8b7cff;
  --line: rgba(246, 183, 60, 0.22);
  --line-cyan: rgba(98, 230, 255, 0.2);
  --font-display: "Didot", "Bodoni MT", "Playfair Display", Georgia, serif;
  --font-body: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-mono: "SF Mono", "Cascadia Code", "Liberation Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #010208;
    --bg-2: #050812;
    --surface: rgba(9, 13, 27, 0.78);
    --surface-strong: rgba(11, 16, 32, 0.96);
    --ink: #fff3d6;
    --muted: #b3bfd4;
    --faint: #71809a;
    --gold: #ffc44d;
    --gold-soft: #ffe3a3;
    --cyan: #6ff0ff;
    --cyan-deep: #18a8cc;
    --violet: #9a8cff;
    --line: rgba(255, 196, 77, 0.25);
    --line-cyan: rgba(111, 240, 255, 0.22);
  }
}
html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  overflow-x: clip;
}
body {
  background:
    radial-gradient(circle at 50% 18%, rgba(246, 183, 60, 0.13), transparent 32rem),
    radial-gradient(circle at 82% 8%, rgba(98, 230, 255, 0.1), transparent 26rem),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 48%, #010208 100%);
}
* {
  box-sizing: border-box;
}
button,
input {
  font: inherit;
}
.font-display {
  font-family: var(--font-display);
}
.font-mono2 {
  font-family: var(--font-mono);
}
.glass {
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.025)), var(--surface);
  border: 1px solid var(--line);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(18px);
}
.glass-strong {
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03)), var(--surface-strong);
  border: 1px solid var(--line);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.09);
  backdrop-filter: blur(20px);
}
.text-glow-gold {
  text-shadow: 0 0 22px rgba(246, 183, 60, 0.55), 0 0 54px rgba(246, 183, 60, 0.22);
}
.text-glow-cyan {
  text-shadow: 0 0 18px rgba(98, 230, 255, 0.5);
}
@keyframes slowPulse {
  0%, 100% {
    opacity: 0.62;
    transform: scale(1);
  }
  50% {
    opacity: 1;
    transform: scale(1.035);
  }
}
@keyframes photonPulse {
  0%, 100% {
    opacity: 0.72;
    filter: drop-shadow(0 0 8px rgba(255, 196, 77, 0.8));
  }
  50% {
    opacity: 1;
    filter: drop-shadow(0 0 20px rgba(255, 196, 77, 1));
  }
}
@keyframes driftY {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-7px);
  }
}
@keyframes marqueeRepos {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-50%);
  }
}
@keyframes shimmerLine {
  from {
    background-position: 200% 0;
  }
  to {
    background-position: -200% 0;
  }
}
.animate-slow-pulse {
  animation: slowPulse 5.5s ease-in-out infinite;
}
.animate-photon {
  animation: photonPulse 3.8s ease-in-out infinite;
}
.animate-drift {
  animation: driftY 7s ease-in-out infinite;
}
.repo-marquee {
  animation: marqueeRepos 46s linear infinite;
}
.repo-marquee:hover {
  animation-play-state: paused;
}
.shimmer-line {
  background: linear-gradient(90deg, transparent, rgba(255, 211, 106, 0.75), rgba(98, 230, 255, 0.65), transparent);
  background-size: 200% 100%;
  animation: shimmerLine 5s linear infinite;
}
input[type="range"] {
  accent-color: var(--gold);
}
::-moz-selection {
  background: rgba(246, 183, 60, 0.85);
  color: #120a02;
}
::selection {
  background: rgba(246, 183, 60, 0.85);
  color: #120a02;

}
.hover\:bg-black\/55:hover {
  background-color: rgb(0 0 0 / 0.55);
}
.hover\:bg-cyan-300\/20:hover {
  background-color: rgb(103 232 249 / 0.2);
}
.hover\:bg-white\/10:hover {

  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}
