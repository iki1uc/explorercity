  padding-bottom: 0.75rem;
}
.py-4{
  padding-top: 1rem;
  padding-bottom: 1rem;
}
.pb-16{
  padding-bottom: 4rem;
}
.pb-2{
  padding-bottom: 0.5rem;
}
.pt-6{
  padding-top: 1.5rem;
}
.pt-8{
  padding-top: 2rem;
}
.text-left{
  text-align: left;
}
.text-center{
  text-align: center;
}
.font-mono{
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
}
.font-sans{
  font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
}
.text-3xl{
  font-size: 1.875rem;
  line-height: 2.25rem;
}
.text-\[10px\]{
  font-size: 10px;
}
.text-\[11px\]{
  font-size: 11px;
}
.text-\[13px\]{
  font-size: 13px;
}
.text-\[9px\]{
  font-size: 9px;
}
.text-lg{
  font-size: 1.125rem;
  line-height: 1.75rem;
}
.text-sm{
  font-size: 0.875rem;
  line-height: 1.25rem;
}
.text-xl{
  font-size: 1.25rem;
  line-height: 1.75rem;
}
.text-xs{
  font-size: 0.75rem;
  line-height: 1rem;
}
.font-black{
  font-weight: 900;
}
.font-bold{
  font-weight: 700;
}
.leading-relaxed{
  line-height: 1.625;
}
.leading-tight{
  line-height: 1.25;
}
.tracking-\[0\.18em\]{
  letter-spacing: 0.18em;
}
.tracking-\[0\.25em\]{
  letter-spacing: 0.25em;
}
.tracking-\[0\.28em\]{
  letter-spacing: 0.28em;
}
.tracking-\[0\.3em\]{
  letter-spacing: 0.3em;
}
.tracking-\[0\.4em\]{
  letter-spacing: 0.4em;
}
.tracking-wide{
  letter-spacing: 0.025em;
}
.tracking-widest{
  letter-spacing: 0.1em;
}
.text-\[var\(--cyan\)\]{
  color: var(--cyan);
}
.text-\[var\(--gold\)\]{
  color: var(--gold);
}
.text-\[var\(--ink\)\]{
  color: var(--ink);
}
.text-\[var\(--muted\)\]{
  color: var(--muted);
}
.text-\[var\(--violet\)\]{
  color: var(--violet);
}
.text-black{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.underline{
  text-decoration-line: underline;
}
.decoration-dotted{
  text-decoration-style: dotted;
}
.underline-offset-4{
  text-underline-offset: 4px;
}
.shadow-\[0_0_28px_rgba\(232\2c 196\2c 118\2c 0\.45\)\]{
  --tw-shadow: 0 0 28px rgba(232,196,118,0.45);
  --tw-shadow-colored: 0 0 28px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}
.backdrop-blur-md{
  --tw-backdrop-blur: blur(12px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}
.transition-all{
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
.transition-transform{
  transition-property: transform;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
:root{
  --bg:#030308;
  --surface:#0a0a18;
  --surface2:#101024;
  --line:#2a2a4a;
  --ink:#e8e6f5;
  --muted:#9a97b8;
  --gold:#e8c476;
  --violet:#8b7cf6;
  --cyan:#6fd8e8;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#07071a;
    --surface:#0d0d22;
    --surface2:#141432;
    --line:#2a2a4a;
    --ink:#e8e6f5;
    --muted:#9a97b8;
    --gold:#e8c476;
    --violet:#8b7cf6;
    --cyan:#6fd8e8;
  }
}
html{
  scroll-behavior:smooth
}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Space Grotesk',system-ui,sans-serif
}
.font-display{
  font-family:'Cinzel',serif
}
@keyframes spinSlow{
  from{
    transform:rotate(0deg)
  }
  to{
    transform:rotate(360deg)
  }
}
@keyframes spinRev{
  from{
    transform:rotate(360deg)
  }
  to{
    transform:rotate(0deg)
  }
}
@keyframes pulseGlow{
  0%,100%{
    opacity:.55
  }
  50%{
    opacity:1
  }
}
@keyframes twinkle{
  0%,100%{
    opacity:.25
  }
  50%{
    opacity:1
  }
}
@keyframes sway{
  0%,100%{
    transform:rotate(-2.4deg)
  }
  50%{
    transform:rotate(2.4deg)
  }
}
@keyframes dashFlow{
  to{
    stroke-dashoffset:-40
  }
}
.spin-slow{
  animation:spinSlow 60s linear infinite;
  transform-origin:center
}
.spin-rev{
  animation:spinRev 90s linear infinite;
  transform-origin:center
}
.pulse-glow{
  animation:pulseGlow 3.2s ease-in-out infinite
}
.twinkle{
  animation:twinkle 2.6s ease-in-out infinite
}
.sway{
  animation:sway 7s ease-in-out infinite;
  transform-origin:300px 210px
}
.flow{
  stroke-dasharray:6 8;
  animation:dashFlow 1.6s linear infinite
}
.hover\:text-\[var\(--ink\)\]:hover{
  color: var(--ink);
}
@media (min-width: 640px){
  .sm\:inline{
    display: inline;
  }
  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .sm\:p-7{
    padding: 1.75rem;
  }
  .sm\:text-2xl{
    font-size: 1.5rem;
    line-height: 2rem;
  }
  .sm\:text-5xl{
    font-size: 3rem;
    line-height: 1;
  }
  .sm\:text-base{
    font-size: 1rem;
    line-height: 1.5rem;
  }
  .sm\:text-sm{
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
}
@media (min-width: 768px){
  .md\:flex{
    display: flex;
  }
  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .md\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
@media (min-width: 1024px){
  .lg\:grid-cols-\[1fr_320px\]{
    grid-template-columns: 1fr 320px;
  }
}
